<section class="pattern-inspector-v4" data-pattern-inspector-v4>
  <header class="pi-v4-status" aria-label="Pattern Inspector status bar">
    <div class="pi-v4-status__identity">
      <span class="pi-v4-status__signal" aria-hidden="true"></span>
      <span>Live Prototype</span>
    </div>
    <p class="pi-v4-status__message" data-pi-status-message aria-live="polite">Workspace mode</p>
    <div class="pi-v4-status__view-mode" aria-label="View mode">
      <span class="pi-v4-status__mode" data-pi-view-mode>Workspace</span>
      <button class="pi-v4-panel-toggle" type="button" data-pi-panel-control="left" data-pi-controls="navigation" aria-expanded="true">
        <span aria-hidden="true">☰</span>
        <span data-pi-control-label>Hide navigation</span>
      </button>
      <button class="pi-v4-panel-toggle" type="button" data-pi-panel-control="right" data-pi-controls="inspector" aria-expanded="true">
        <span aria-hidden="true">◫</span>
        <span data-pi-control-label>Hide inspector</span>
      </button>
    </div>
  </header>

  <div class="pi-v4-workspace" data-pi-workspace>
    <aside class="pi-v4-panel pi-v4-panel--navigation" data-pi-left-panel data-pi-id="navigation">
      <header class="pi-v4-panel__header">
        <p class="pi-v4-panel__eyebrow">Library</p>
        <h2 class="pi-v4-panel__title" data-pi-id="navigation-title">Patterns</h2>
      </header>
      <div class="pi-v4-panel__body">
        <nav aria-label="Design families and patterns" data-pi-navigation-tree></nav>
      </div>
    </aside>

    <main class="pi-v4-viewer" data-pi-viewer data-pi-id="viewer">
      <header class="pi-v4-viewer__header">
        <div class="pi-v4-viewer__heading">
          <p class="pi-v4-viewer__kicker">Current Pattern</p>
          <h1 class="pi-v4-viewer__title" data-pi-pattern-name data-pi-id="viewer-title">Pattern</h1>
          <p class="pi-v4-viewer__description" data-pi-pattern-description></p>
        </div>
        <dl class="pi-v4-viewer__metadata" aria-label="Pattern implementation metadata">
          <div><dt>Family</dt><dd data-pi-family-id></dd></div>
          <div><dt>Version</dt><dd data-pi-version-id></dd></div>
          <div><dt>Status</dt><dd data-pi-pattern-status></dd></div>
          <div><dt>Review</dt><dd data-pi-review-state></dd></div>
        </dl>
      </header>

      <figure class="pi-v4-canvas">
        <div class="pi-v4-stage" data-pi-pattern-stage></div>
        <figcaption class="pi-v4-pattern-navigation">
          <button type="button" data-pi-pattern-previous><span aria-hidden="true">&lt;</span> Prev</button>
          <span data-pi-pattern-position>Pattern 1 of 1</span>
          <button type="button" data-pi-pattern-next>Next <span aria-hidden="true">&gt;</span></button>
        </figcaption>
      </figure>
    </main>

    <button class="pi-v4-drawer-backdrop" type="button" tabindex="-1" hidden data-pi-drawer-backdrop aria-label="Close active panel"></button>

    <aside class="pi-v4-panel pi-v4-panel--inspector" data-pi-right-panel data-pi-id="inspector">
      <header class="pi-v4-panel__header">
        <p class="pi-v4-panel__eyebrow">Implementation</p>
        <h2 class="pi-v4-panel__title" data-pi-id="inspector-title">Inspector</h2>
      </header>
      <div class="pi-v4-panel__body">
        <div class="pi-v4-tabs" role="tablist" aria-label="Inspection category">
          <button class="pi-v4-tab is-active" type="button" role="tab" aria-selected="true" tabindex="0" data-pi-tab="token" data-pi-id="tab-token" data-pi-controls="tabpanel">Token</button>
          <button class="pi-v4-tab" type="button" role="tab" aria-selected="false" tabindex="-1" data-pi-tab="state" data-pi-id="tab-state" data-pi-controls="tabpanel">State</button>
          <button class="pi-v4-tab" type="button" role="tab" aria-selected="false" tabindex="-1" data-pi-tab="accessibility" data-pi-id="tab-accessibility" data-pi-controls="tabpanel">A11y</button>
          <button class="pi-v4-tab" type="button" role="tab" aria-selected="false" tabindex="-1" data-pi-tab="className" data-pi-id="tab-class" data-pi-controls="tabpanel">Class</button>
        </div>

        <div class="pi-v4-tabpanel" role="tabpanel" data-pi-id="tabpanel" data-pi-tabpanel>
          <ol class="pi-v4-parts" data-pi-inspector-parts></ol>
          <section class="pi-v4-detail" data-pi-id="inspector-detail" aria-live="polite" aria-atomic="true">
            <p class="pi-v4-detail__label" data-pi-detail-label>Token</p>
            <h3 class="pi-v4-detail__title" data-pi-detail-title></h3>
            <p class="pi-v4-detail__value" data-pi-detail-value></p>
            <p class="pi-v4-detail__description" data-pi-detail-description></p>
          </section>
        </div>
      </div>
    </aside>
  </div>
</section>
